_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: OpenHands Thread Routing Demo
  description: Verifies Slack thread follow-up routing over Socket Mode
  background_color: "#4f46e5"
features:
  bot_user:
    display_name: OpenHands Routing Demo
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
