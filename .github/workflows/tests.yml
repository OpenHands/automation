---
name: Run tests

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: write
    pull-requests: write

jobs:
    unit-tests:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Reject temporary artifacts in release PRs
              if: >-
                  github.event_name == 'pull_request' &&
                  startsWith(github.head_ref, 'release-please--')
              run: |
                  set -euo pipefail
                  artifacts="$(git ls-tree -r --name-only HEAD -- .pr)"
                  if [ -n "$artifacts" ]; then
                    echo "::error::Release PR contains temporary .pr artifacts. Merge the cleanup PR and let release-please update this PR before merging."
                    printf '%s\n' "$artifacts"
                    exit 1
                  fi

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.12'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Run unit tests with coverage
              run: |
                  rm -f .coverage
                  CI=true uv run python -m pytest -vvs \
                    --cov=openhands/automation \
                    --cov-report=term-missing \
                    --cov-report=xml:coverage.xml \
                    --cov-fail-under=76 \
                    tests/

            - name: Pytest coverage PR comment
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: MishaKav/pytest-coverage-comment@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  pytest-xml-coverage-path: coverage.xml
                  title: Coverage Report
                  create-new-comment: false
                  hide-report: false
