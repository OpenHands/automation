---
name: Run tests

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: write
    pull-requests: write

jobs:
    unit-tests:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  # SonarQube reads git history to attribute issues to authors.
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.12'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Run unit tests with coverage
              run: |
                  rm -f .coverage
                  CI=true uv run python -m pytest -vvs \
                    --cov=openhands/automation \
                    --cov-report=term-missing \
                    --cov-report=xml:coverage.xml \
                    --cov-fail-under=0 \
                    tests/

            - name: Pytest coverage PR comment
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: MishaKav/pytest-coverage-comment@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  pytest-xml-coverage-path: coverage.xml
                  title: Coverage Report
                  create-new-comment: false
                  hide-report: false


            # coverage.xml is written by the pytest step above. Fork PRs get no secrets,
            # so the scan could only fail on a missing token -- skip rather than fail red.
            - name: SonarQube analysis
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
