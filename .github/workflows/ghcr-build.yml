---
# Workflow that builds and pushes the automation docker image to ghcr.io.
# Each architecture builds on a native runner and pushes a `sha-<full>-<arch>`
# image; the merge job then publishes every tag as a multi-arch manifest.
name: Docker

on:
    push:
        branches:
            - main
        tags:
            - '*'
    pull_request:
    workflow_dispatch:
        inputs:
            reason:
                description: Reason for manual trigger
                required: true
                default: ''

# If triggered by a PR, it will be in the same group. However, each commit on main will be in its own unique group
concurrency:
    group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: openhands/automation
    RELEVANT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
    ghcr_build:
        name: Build and Push Automation Image (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,format=long
                  flavor: |
                      latest=false
                      suffix=-${{ matrix.arch }}
              env:
                  DOCKER_METADATA_PR_HEAD_SHA: true

            - name: Build and push Docker image
              if: '!github.event.pull_request.head.repo.fork'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: containers/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/${{ matrix.arch }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
                  provenance: true
                  sbom: true

      # Forked repos can't push to GHCR, so we just build to verify the image builds
            - name: Build Docker image (fork)
              if: github.event.pull_request.head.repo.fork
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: containers/Dockerfile
                  push: false
                  tags: ${{ steps.meta.outputs.tags }}
                  platforms: linux/${{ matrix.arch }}

    ghcr_merge:
        name: Publish Multi-Arch Manifest
        needs: ghcr_build
        if: '!github.event.pull_request.head.repo.fork'
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=sha,format=long
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                  flavor: |
                      latest=auto
                      prefix=
                      suffix=
              env:
                  DOCKER_METADATA_PR_HEAD_SHA: true

            - name: Create multi-arch manifest
              env:
                  SRC: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.RELEVANT_SHA }}
                  TAGS: ${{ steps.meta.outputs.tags }}
              shell: bash
              run: |
                  set -euo pipefail
                  args=()
                  while IFS= read -r tag; do
                    [[ -z "$tag" ]] && continue
                    args+=(-t "$tag")
                  done <<< "$TAGS"
                  docker buildx imagetools create "${args[@]}" "${SRC}-amd64" "${SRC}-arm64"
                  docker buildx imagetools inspect "$SRC"
