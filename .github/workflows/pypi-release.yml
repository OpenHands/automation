---
# Publishes the openhands-automation PyPI package using trusted publishing (OIDC).
# Triggered when a tag is pushed or manually via workflow_dispatch.
# Requires trusted publishing to be configured in PyPI project settings.
name: Publish PyPI Package

on:
    push:
        tags:
            - '*'
    workflow_dispatch:
        inputs:
            reason:
                description: Reason for manual trigger
                required: true
                default: ''

jobs:
    release:
        runs-on: ubuntu-24.04
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install uv
              uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  version: latest

            - name: Set up Python
              run: uv python install 3.12

            - name: Build package
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

