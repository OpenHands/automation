---
# Publishes the openhands-automation PyPI package using trusted publishing (OIDC).
# Triggered when a tag is pushed or manually via workflow_dispatch.
# Requires trusted publishing to be configured in PyPI project settings.
name: Publish PyPI Package

on:
    push:
        tags:
            - '*'
    workflow_dispatch:
        inputs:
            reason:
                description: Reason for manual trigger
                required: true
                default: ''

jobs:
    release:
        runs-on: ubuntu-24.04
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: latest

            - name: Set up Python
              run: uv python install 3.12

            - name: Build package
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

    # Agent Canvas opens its own pin bump PR with the shared bump-pins workflow
    # (OpenHands/release-actions), which it also runs every hour. This dispatch
    # only makes that run start now instead of at its next scheduled time, so a
    # failure here does not fail the release.
    notify-agent-canvas:
        needs: release
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        continue-on-error: true
        permissions: {}
        steps:
            - name: Mint GitHub App token (release bot)
              id: app-token
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: OpenHands
                  repositories: OpenHands
                  permission-contents: write

            - name: Ask Agent Canvas to open its pin bump PR
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  # bump-pins only takes stable releases; tags like 1.0.0a1 exist here.
                  if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "$TAG is not a stable release; Agent Canvas is not notified."
                    exit 0
                  fi
                  gh api repos/OpenHands/OpenHands/dispatches \
                    -f event_type=upstream-released \
                    -f "client_payload[expect]=AUTOMATION=$TAG"
